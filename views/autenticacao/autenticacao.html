<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar ou cadastrar | Volt Switch</title>
    <link rel="stylesheet" href="../../css/base/base.css">
    <link rel="stylesheet" href="../../css/componentes/componentes.css">
    <link rel="stylesheet" href="../../css/paginas/paginas.css">
</head>
<body>
    <header class="header-principal fixed">
        <div class="logo">
            <a href="../../index.html">VOLT SWITCH <span>Eletrônicos</span></a>
        </div>
        <div class="acoes-usuario">
            <a href="../../index.html">Voltar à loja</a>
        </div>
    </header>
    <main class="area-autenticacao">
        <div class="formulario">
        <section class="cartao-autenticacao">
            <h1 id="titulo-autenticacao">Entre na sua conta</h1>
            <p class="descricao-autenticacao">Acesse sua conta Volt Switch para continuar.</p>

            <div class="abas-autenticacao">
                <button type="button" id="botao-entrar" class="aba ativa">Entrar</button>
                <button type="button" id="botao-cadastrar" class="aba">Criar conta</button>
            </div>

            <form id="form-autenticacao">
                <div id="campo-nome" class="campo-autenticacao" hidden>
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name">
                </div>

                <div class="campo-autenticacao">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required autocomplete="email">
                </div>

                <div class="campo-autenticacao">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="6" autocomplete="current-password">
                </div>

                <p id="mensagem-autenticacao" class="mensagem-autenticacao" role="status"></p>
                <button type="submit" class="botao-autenticacao" id="botao-enviar">Entrar</button>
            </form>

        </section>
        </div>
    </main>
    <script src="../../js/usuario/usuario.js"></script>
</body>
</html>
