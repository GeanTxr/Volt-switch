<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu carrinho | Volt Switch</title>
    <link rel="stylesheet" href="../../css/base/base.css">
    <link rel="stylesheet" href="../../css/componentes/componentes.css">
    <link rel="stylesheet" href="../../css/paginas/paginas.css">
</head>
<body>
    <div class="cabecalho-fixo">
        <header class="header-principal">
            <div class="logo"><a href="../../index.html">VOLT SWITCH <span>Eletrônicos</span></a></div>
            <form class="form-busca" action="../produtos/produtos.html">
                <input name="busca" type="search" aria-label="Buscar produtos" placeholder="Buscar produtos...">
                <button type="submit">Buscar</button>
            </form>
            <div class="acoes-usuario"><a href="../user/user.html">Minha conta</a><a href="carrinho.html"><strong class="link-carrinho">Carrinho (0)</strong></a></div>
        </header>
        <nav class="nav-categorias"><ul class="menu-principal"><li class="item-menu"><a class="destaque" href="../produtos/produtos.html">Continuar comprando</a></li></ul></nav>
    </div>
    <main class="container">
        <section class="secao-produtos">
            <h1 class="titulo-secao">Meu carrinho</h1>
            <div id="itens-carrinho"></div>
            <div class="resumo-carrinho">
                <h2 id="total-carrinho">Total: R$ 0,00</h2>
                <button class="btn-comprar" id="finalizar-compra" disabled>Registrar pedido de teste</button>
            </div>
            <p class="texto-resultados">Compra de demonstração: não há pagamento ou envio real.</p>
            <p id="estado-carrinho" role="status"></p>
        </section>
    </main>
    <footer class="rodape"><div class="copyright">© 2026 Volt Switch Eletrônicos. Projeto Acadêmico.</div></footer>
    <script type="module" src="../../js/usuario/carrinho.js"></script>

</html>
